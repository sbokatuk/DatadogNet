name: build

# Reusable pipeline: packs every package at a given version, validates the packed packages, runs the
# device checks on both an iOS simulator and an Android emulator, builds the MAUI sample against the
# packed packages, and uploads the packages as an artifact. Callers (pr.yml, release.yml) decide the
# version and what to do with the result.

on:
  workflow_call:
    inputs:
      verify:
        description: >
          Whether to run the verification jobs — package validation, the sample builds, the
          Release link checks and the e2e suites. Pull requests leave it at true, and are the only
          place any of this runs. Releases pass false: the tagged commit was already verified on
          its pull request, so a tag packs and publishes and nothing more. The gate is the same
          input, with the same name and the same meaning, in every repository.
        required: false
        default: true
        type: boolean
      version:
        description: NuGet version to stamp on every package.
        required: true
        type: string
      e2e-ios-target-frameworks:
        description: >
          Which of the packages' target frameworks the simulator checks run against, as a JSON
          array. Defaults to the two extremes: net8, the oldest asset set and the one nothing else
          exercises, and net10, whose assets are produced by the merge step in BuildNugets.sh and so
          are the only ones that could be grafted in wrong. net9 sits between them and comes out of
          the same pack pass as net8, so testing it too would buy little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string
      e2e-android-target-frameworks:
        description: Same, for the emulator checks.
        required: false
        default: '["net8.0-android34.0", "net10.0-android36.0"]'
        type: string
      e2e-api-level:
        description: Android API level the emulator boots.
        required: false
        default: 35
        type: number
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: build and pack
    timeout-minutes: 60
    # macOS for the whole build, unlike DatadogNet.Android which packs on Linux: every package here
    # has an iOS head, and there is no cross-platform path for the Apple toolchain. A package is
    # only complete once both heads are in it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check README versions
        run: ./build/CheckReadmeVersions.sh

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 9.0.x packs the net9 band (global.json pins it) and 10.0.x packs net10.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install workloads for every SDK band
        run: |
          # Each band supplies different reference packs: net9.0-android35.0 and net9.0-ios18.0 come
          # from the .NET 9 band, net10.0-android36.0 and net10.0-ios26.0 from the .NET 10 band. The
          # SDK is chosen by the global.json in the working directory, so each band is installed
          # from a scratch directory pinned to that SDK.
          #
          # maui is installed in both bands rather than only where the sample is built:
          # DatadogNet.Maui is a package, and it is packed in both passes.
          #
          # maccatalyst is its own workload rather than something ios drags in, so a Catalyst head
          # fails with NETSDK1147 telling you to install a workload the ios line looks like it
          # already covered.
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            echo "installing workloads for SDK ${sdk}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install android ios maccatalyst maui-android maui-ios maui-maccatalyst )
          done

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Pack all packages
        run: ./build/BuildNugets.sh "${{ inputs.version }}"

      - name: Validate packages
        if: ${{ inputs.verify }}
        env:
          DATADOG_PACKAGE_VERSION: ${{ inputs.version }}
        run: dotnet test tests/DatadogNet.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: ${{ inputs.verify && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  e2e-ios:
    name: simulator checks (${{ matrix.target-framework }})
    if: ${{ inputs.verify }}
    timeout-minutes: 45
    needs: pack
    runs-on: macos-15
    strategy:
      # fail-fast off: when one target framework breaks it is worth knowing whether the other did
      # too, since "net8 only" and "both" point at very different causes.
      fail-fast: false
      matrix:
        target-framework: ${{ fromJSON(inputs.e2e-ios-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install the iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload for
          # the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run checks on simulator
        run: ./.github/scripts/run-simulator-tests.sh "${{ inputs.version }}" "${{ matrix.target-framework }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-android:
    name: emulator checks (${{ matrix.target-framework }})
    if: ${{ inputs.verify }}
    timeout-minutes: 60
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        target-framework: ${{ fromJSON(inputs.e2e-android-target-frameworks) }}
    # Linux, unlike the pack job: the emulator needs KVM, which the macOS runners do not have, and
    # the Android head of the device app needs no Apple toolchain to build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x is here for the net8 matrix leg only - see the workload step below.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the Android workload for every SDK band
        run: |
          # One band per Android API level, because that is what owns the runtime packs: API 34 is
          # the .NET 8 workload, 35 the .NET 9 one, 36 the .NET 10 one. Installing only the band
          # global.json pins lets a net8 app compile and then fail at packaging with NETSDK1112.
          # See the comment in run-emulator-tests.sh.
          for major in 8 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)" --force \
              && dotnet workload install android )
          done
          dotnet workload install android

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Free disk space for the emulator
        run: |
          # The AVD's userdata partition needs ~7.2 GB free, and this job has already installed
          # three .NET SDK bands, three Android workloads, three platform SDKs, a system image
          # and the packed packages. Runs have died here with
          #
          #     FATAL | Not enough space to create userdata partition.
          #             Available: 5666.53 MB, need 7372.80 MB.
          #
          # which fails as an emulator boot timeout several minutes later, long after the real
          # cause scrolled past. None of the following is used by this job: no native code is
          # compiled (the .aar ships prebuilt .so files), so the NDK alone is ~5 GB of dead
          # weight. Deliberately NOT touching /usr/share/dotnet or the rest of the Android SDK.
          echo "before: $(df -h --output=avail / | tail -1) available"
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          docker image prune --all --force || true
          echo "after:  $(df -h --output=avail / | tail -1) available"

      - name: Enable KVM
        # The x86_64 emulator is unusably slow without hardware acceleration, and the runner image
        # does not grant access to /dev/kvm by default.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.e2e-api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/run-emulator-tests.sh "${{ inputs.version }}" "${{ matrix.target-framework }}"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs-${{ matrix.target-framework }}
          path: emulator-tests.log
          if-no-files-found: ignore
          retention-days: 7

  sample:
    name: build sample app
    timeout-minutes: 45
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # The sample targets the net10 band. MAUI 9 cannot build against the AndroidX generation the
      # Datadog Android bindings depend on - see the target-framework block in Directory.Build.props
      # and DatadogNet.Android's own README.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI workload for the .NET 10 band
        run: |
          # Workloads are installed per SDK band, and the SDK is resolved from the working
          # directory - so this has to run from the same scratch global.json the build uses. At the
          # repository root global.json pins .NET 9, so installing there puts maui on a band the
          # build never sees, and the build then fails with NETSDK1147 telling you to install a
          # workload you just installed.
          dir="${RUNNER_TEMP}/sample-sdk"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson \
                 --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install maui-android maui-ios maui-maccatalyst )

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The sample consumes the packed packages exactly as a user would, so it is the only thing
      # that checks the API is still usable the way the README documents - including DatadogNet.Maui,
      # which the device checks deliberately do not reference.
      - name: Build the sample against the packed packages
        run: |
          ( cd "${RUNNER_TEMP}/sample-sdk" \
            && for tfm in net10.0-android36.0 net10.0-ios26.0 net10.0-maccatalyst26.0; do
                 echo "==> ${tfm}"
                 dotnet build "${GITHUB_WORKSPACE}/samples/DatadogNet.Maui.Sample/DatadogNet.Maui.Sample.csproj" \
                   --configuration Debug \
                   --framework "${tfm}" \
                   -p:DatadogPackageVersion="${{ inputs.version }}" \
                   || exit 1
               done )

      # The windows stub head, compiled from a consumer. Not a sample TFM: a windows-headed MAUI
      # *app* runs WinUI's XamlCompiler.exe, a Windows-only executable, so on these macOS runners
      # the consumer compile is a XAML-free MAUI class library - which is exactly the packaging
      # promise under test (restore resolves the windows asset, UseDatadog compiles against it).
      - name: Build the windows-head consumer check
        run: |
          ( cd "${RUNNER_TEMP}/sample-sdk" \
            && dotnet build "${GITHUB_WORKSPACE}/tests/DatadogNet.Maui.WindowsHeadCheck/DatadogNet.Maui.WindowsHeadCheck.csproj" \
                 --configuration Debug \
                 -p:DatadogPackageVersion="${{ inputs.version }}" )

  # The sample job above compiles in Debug, which restores, resolves and links but never runs the
  # linker or the AOT compiler — and those are what a consumer actually ships. DatadogNet.Mac has
  # carried a Release leg for exactly this reason, with the note that "the ILLink/AOT behaviour
  # Release turns on has broken binding consumers that built fine in Debug"; this is the same
  # check for the MAUI metapackage, on the two platforms where Release changes the most.
  #
  # Affordable here in a way it is not everywhere: the Datadog xcframeworks are small, unlike the
  # WebRTC-sized payloads in AntMedia.Net and Red5Pro.Streaming.Net, whose build files record a
  # measured 38-minute iOS Release build and are deliberately left in Debug.
  link-release:
    name: Release link check (${{ matrix.platform }})
    if: ${{ inputs.verify }}
    timeout-minutes: 60
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android on Linux: R8 and managed trimming need no Apple toolchain, and the ubuntu
          # runner bills at a tenth of the macOS one.
          - platform: android
            os: ubuntu-latest
            tfm: net10.0-android36.0
            args: ''
          - platform: ios
            os: macos-15
            tfm: net10.0-ios26.0
            args: '-p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: ${{ matrix.platform == 'ios' }}
        uses: ./.github/actions/select-xcode

      # The sample targets the net10 band — see the note on the sample job.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI workload for the .NET 10 band
        run: |
          # Workloads are installed per SDK band and the SDK is resolved from the working
          # directory, so this has to run from the same scratch global.json the build uses — see
          # the longer note on the sample job.
          dir="${RUNNER_TEMP}/sample-sdk"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson \
                 --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install maui-${{ matrix.platform }} )

      - name: Set up the Android SDK
        if: ${{ matrix.platform == 'android' }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # Code signing off on iOS, because a public runner has neither a certificate nor a
      # provisioning profile, and neither affects whether the thing links.
      #
      # TargetFrameworks is overridden, not just --framework: the implicit restore deliberately
      # drops the TargetFramework --framework sets, so it evaluates every target framework in the
      # project and demands a workload for each. Only one platform's workload is installed here,
      # so the sample's other two heads failed restore before a single line was compiled -
      # NETSDK1147 on macOS (android not installed) and NETSDK1178 on Linux, where the iOS packs
      # do not exist at all and no amount of installing would have helped.
      - name: Link the sample in Release
        run: |
          ( cd "${RUNNER_TEMP}/sample-sdk" \
            && dotnet build "${GITHUB_WORKSPACE}/samples/DatadogNet.Maui.Sample/DatadogNet.Maui.Sample.csproj" \
                 --configuration Release \
                 --framework "${{ matrix.tfm }}" \
                 -p:TargetFrameworks="${{ matrix.tfm }}" \
                 ${{ matrix.args }} \
                 -p:DatadogPackageVersion="${{ inputs.version }}" )

          # Asserted rather than assumed: a Release build that trimmed the binding away, or that
          # never got as far as packaging, would still leave a bin/ directory behind.
          out="samples/DatadogNet.Maui.Sample/bin/Release/${{ matrix.tfm }}"
          if [ "${{ matrix.platform }}" = 'android' ]; then
            artefact="$(find "${out}" -name '*.apk' | head -1)"
          else
            artefact="$(find "${out}/ios-arm64" -maxdepth 1 -name '*.app' | head -1)"
          fi
          if [ -z "${artefact}" ]; then
            echo "::error::no Release output under ${out} — the ${{ matrix.platform }} Release build did not package"
            exit 1
          fi
          echo "==> ${artefact}"
